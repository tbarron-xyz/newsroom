services:
  test:
    build: .
    environment:
      - DATA_STORAGE_BACKEND=sqlite
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=test
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - redis
    command: node --import tsx --test

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATA_STORAGE_BACKEND=sqlite
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
